name: Build APK

# Roda sozinho quando você envia arquivos, e também pelo botão "Run workflow".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # necessário para publicar o APK na aba Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v4

      - name: Encontrar o projeto (pasta ou ZIP)
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "Projeto encontrado na raiz do repositório."
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            ZIP=$(ls ./*.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP" ]; then
              echo "::error::Não achei o projeto. Envie o StickLab.zip (ou a pasta do projeto) para o repositório."
              exit 1
            fi
            echo "Projeto encontrado dentro de $ZIP, extraindo..."
            mkdir -p /tmp/proj
            unzip -q "$ZIP" -d /tmp/proj
            SETTINGS=$(find /tmp/proj -name settings.gradle.kts | head -n 1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::O ZIP não contém um projeto Android (settings.gradle.kts não encontrado)."
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar o Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Instalar o Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar o APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Renomear o APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/StickLab.apk"

      - name: Guardar o APK como arquivo da execução (backup)
        uses: actions/upload-artifact@v4
        with:
          name: StickLab-APK
          path: StickLab.apk

      - name: Publicar o APK na aba Releases (download direto)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest StickLab.apk \
            --target "$GITHUB_SHA" \
            --title "StickLab - APK mais recente" \
            --notes "Toque em StickLab.apk para baixar e instalar no Android. Gerado automaticamente em cada compilação."
